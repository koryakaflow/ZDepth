name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version
        run: |
          v="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' zdepth/__init__.py)"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but __version__ $v"; exit 1; }
          grep -q "\"version\": \"$v\"" zdepth/effect.py || { echo "effect manifest version is not $v"; exit 1; }

      - name: Tests (no model)
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q numpy
          /tmp/venv/bin/python tests/test_protocol.py
          /tmp/venv/bin/python tests/test_outputs.py
          bash -n effectcraft-helper-zdepth && sh -n install.sh

      - name: Build
        run: tools/make_release.sh "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/zdepth.tar.gz dist/zdepth.tar.gz.sha256 dist/install.sh \
            --title "ZDepth $GITHUB_REF_NAME" --notes-file "release-notes/$GITHUB_REF_NAME.md"
